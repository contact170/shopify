      }
      tl.fromTo(shakeEl, { x: 0 }, { x: 1, duration: DUR, ease: function (p) { return shakeAt(p * DUR, 0); } }, 0);
      tl.fromTo(shakeEl, { y: 0 }, { y: 1, duration: DUR, ease: function (p) { return shakeAt(p * DUR, 1); } }, 0);
      tl.fromTo(shakeEl, { rotation: 0 }, { rotation: 1, duration: DUR, ease: function (p) { return shakeAt(p * DUR, 2); } }, 0);

      // ---------- one-pass diagonal sheen across the whole grid (5.0) ----------
      cards.concat([total]).forEach(function (c, i) {
        var col = i % 3, row = Math.floor(i / 3);
        var off = col * 326.67 + row * 90;
        tl.fromTo(c.querySelector(".f06-le-pack-band"),
          { x: -300 - off, skewX: -18 },
          { x: 1180 - off, skewX: -18, duration: SHEEN_DUR, ease: "none" }, SHEEN_T);
      });

      // ---------- quantity tick-up (1x -> 2x -> 3x -> 4x) via discrete state swaps ----------
      cards.forEach(function (c, i) {
        var q = c.querySelector(".f06-le-pack-qty");
        var n = parseInt(q.getAttribute("data-qty"), 10);
        if (n <= 1) return;
        q.textContent = "";
        var spans = [];
        for (var k = 1; k <= n; k++) {
          var s = document.createElement("span");
          s.textContent = k + "×";
          s.style.display = k === 1 ? "inline" : "none";
          q.appendChild(s);
          spans.push(s);
        }
        for (var j = 1; j < n; j++) {
          var at = CARD_T[i] + 0.14 + (j - 1) * 0.09;
          tl.set(spans[j - 1], { display: "none" }, at);
          tl.set(spans[j], { display: "inline" }, at);
        }
      });

      // ---------- Scene 1 (0.0–1.0): day switch on the drop ----------
      tl.fromTo($("#f06-le-pack-flash"), { opacity: 0.9 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, 0);
      tl.fromTo(world, { scale: 1.07 }, { scale: 1, duration: 1.1, ease: "expo.out" }, 0);
      tl.fromTo($("#f06-le-pack-shock"), { scale: 0.15, opacity: 0.9 }, { scale: 3.4, opacity: 0, duration: 0.9, ease: "expo.out" }, 0);

      // eyebrow
      tl.fromTo($("#f06-le-pack-dot"), { scale: 0 }, { scale: 1, duration: 0.4, ease: "expo.out" }, 0.05);
      tl.fromTo($("#f06-le-pack-eyetext"),
        { opacity: 0, x: -24, clipPath: "inset(0% 100% 0% 0%)" },
        { opacity: 1, x: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.42, ease: "expo.out" }, 0.1);

      // title waterfall (binary opacity, whip up from below, shrinking gaps)
      var words = $$(".f06-le-pack-w");
      var wStart = [0.35, 0.44, 0.52, 0.59, 0.66, 0.72, 0.78, 0.84];
      var wY     = [80, 45, 42, 50, 70, 40, 46, 84];
      var wDur   = [0.22, 0.16, 0.15, 0.18, 0.2, 0.15, 0.16, 0.26];
      words.forEach(function (el, i) {
        tl.set(el, { opacity: 0, y: wY[i], filter: "blur(6px)" }, 0);
        tl.set(el, { opacity: 1 }, wStart[i]);
        tl.to(el, { y: 0, filter: "blur(0px)", duration: wDur[i], ease: "power4.out" }, wStart[i]);
      });

      // ---------- Scene 2 (1.0–1.55): Vigilia + inverse zoom-through ----------
      var vig = $("#f06-le-pack-vig");
      tl.fromTo(vig, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 1.0);
      tl.fromTo(vig, { scale: 1.6, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 1.0);
      tl.fromTo($("#f06-le-pack-glow"), { opacity: 0, scale: 0.85 }, { opacity: 0.2, scale: 1, duration: 0.6, ease: "power2.out" }, 1.0);

      // keypad boot wave (outline -> navy -> back to grey)
      $$(".f06-le-pack-key").forEach(function (k) {
        var d = (parseInt(k.getAttribute("data-r"), 10) + parseInt(k.getAttribute("data-c"), 10)) * 0.028;
        tl.fromTo(k, { borderColor: "#c9c9c9" }, { borderColor: "#0c1e4a", duration: 0.08, ease: "power2.out" }, 1.12 + d);
        tl.to(k, { borderColor: "#c9c9c9", duration: 0.22, ease: "power2.inOut" }, 1.22 + d);
      });
      // status LEDs + green LED on
      tl.fromTo($$(".f06-le-pack-sdot"), { opacity: 0.25 }, { opacity: 1, duration: 0.12, ease: "power2.out", stagger: 0.04 }, 1.3);
      tl.fromTo($("#f06-le-pack-led"), { backgroundColor: "#d6d9d6" }, { backgroundColor: "#3ccf4e", duration: 0.1, ease: "power2.out" }, 1.36);
      tl.fromTo($("#f06-le-pack-ledglow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 1.36);

      // ---------- Scene 3 (1.55–4.2): one card per beat ----------
      cards.forEach(function (c, i) {
        var T = CARD_T[i];
        var media = c.querySelector(".f06-le-pack-imgbox, .f06-le-pack-cover");
        var qty = c.querySelector(".f06-le-pack-qty");
        var txt = [c.querySelector(".f06-le-pack-label")];
        var model = c.querySelector(".f06-le-pack-model");
        if (model) txt.push(model);
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, T);
        tl.fromTo(c, { scale: 0.6, y: 40, filter: "blur(10px)" }, { scale: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, T);
        tl.fromTo(media, { scale: 1.3, y: -12 }, { scale: 1, y: 0, duration: 0.65, ease: "expo.out" }, T + 0.02);
        tl.fromTo(qty, { scale: 0, rotation: -16 }, { scale: 1, rotation: 0, duration: 0.4, ease: "expo.out" }, T + 0.1);
        tl.fromTo(txt, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.34, ease: "power4.out", stagger: 0.04 }, T + 0.08);
      });

      // ---------- Scene 4 (4.2–6.5): "13 éléments" slam, sheen, hold ----------
      tl.fromTo(total, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, HIT_T);
      tl.fromTo(total, { scale: 1.25, filter: "blur(12px)" }, { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, HIT_T);
      tl.fromTo($("#f06-le-pack-total-flash"), { opacity: 0.85 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, HIT_T + 0.02);
      var ring = $("#f06-le-pack-ring");
      tl.fromTo(ring, { opacity: 0 }, { opacity: 0.9, duration: 0.04, ease: "none" }, HIT_T + 0.02);
      tl.fromTo(ring, { scale: 1 }, { scale: 1.35, duration: 0.7, ease: "expo.out" }, HIT_T + 0.04);
      tl.to(ring, { opacity: 0, duration: 0.6, ease: "power2.out" }, HIT_T + 0.1);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
