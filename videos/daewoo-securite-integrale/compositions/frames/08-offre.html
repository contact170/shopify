    <script>
      (function () {
        var FID = "08-offre";
        var $ = function (s) { return document.getElementById(FID + "-" + s); };
        var tl = gsap.timeline({ paused: true });

        var cam = $("cam"), shake = $("shake");
        var logo = $("logo"), logoImg = logo.querySelector("img");
        var card = $("card"), pack = $("pack"), sheen = $("sheen"), halo = $("card-halo");
        var badge = $("badge"), badgeRing = $("badge-ring");
        var title = $("title");
        var words = title.querySelectorAll(".o8-word");
        var oldText = $("old-text"), oldWrap = $("old"), strike = $("strike");
        var price = $("price"), ghost = $("price-ghost"), pglow = $("price-glow");
        var shock = $("shock"), field = $("field");
        var glow = $("glow"), redglow = $("redglow");
        var ringA = $("ring-a"), ringB = $("ring-b"), ringC = $("ring-c");
        var dateInner = $("date-inner"), dateUl = $("date-ul");
        var urlWrap = $("url-wrap"), url = $("url"), urlBurst = $("url-burst"), urlSheen = $("url-sheen");
        var flash = $("flash"), black = $("black");

        // ---------- deterministic hash ----------
        var prand = function (n) {
          var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        };

        // ---------- spark pool (particle-burst, dot/streak variant) ----------
        var SPARK_N = 30, BURST_AT = 1.9, FLIGHT = 0.95, G = 520, FADE_FRAC = 0.4;
        var palette = ["#e11d48", "#ffffff", "#5b7fd6", "#ff5a7a", "#9db7ff"];
        var sparks = [];
        for (var i = 0; i < SPARK_N; i++) {
          var el = document.createElement("div");
          el.className = "o8-spark";
          var size = 6 + prand(i * 3 + 1) * 8;
          el.style.width = (size * 2.6).toFixed(1) + "px";
          el.style.height = (size * 0.55).toFixed(1) + "px";
          el.style.marginLeft = (-size * 1.3).toFixed(1) + "px";
          el.style.marginTop = (-size * 0.275).toFixed(1) + "px";
          el.style.background = palette[i % palette.length];
          field.appendChild(el);
          // radial, biased upward and wide (the price is wide)
          var ang = (i / SPARK_N) * Math.PI * 2 + (prand(i * 5 + 2) - 0.5) * 0.5;
          var speed = 520 + prand(i * 7 + 3) * 720;
          sparks.push({
            el: el,
            vx: Math.cos(ang) * speed * 1.45,
            vy: Math.sin(ang) * speed * 0.8 - 140,
            ox: Math.cos(ang) * 210,
            oy: Math.sin(ang) * 60,
            deg: (ang * 180) / Math.PI
          });
        }

        // ---------- deterministic camera-shake events (decaying sines) ----------
        // [start, duration, amplitude px, freq x, freq y]
        var SHAKES = [
          [0.42, 0.32, 9, 31, 41],   // card lands (whoosh 0.3)
          [1.3, 0.22, 6, 47, 37],    // strike
          [1.9, 0.62, 28, 43, 53],   // CASH SLAM
          [2.6, 0.26, 7, 39, 49],    // badge pop
          [3.8, 0.26, 6, 45, 35]     // URL click
        ];

        function render(t) {
          // shake (sum of decaying events; exactly 0 outside every window)
          var sx = 0, sy = 0, sr = 0;
          for (var k = 0; k < SHAKES.length; k++) {
            var s = SHAKES[k];
            var p = (t - s[0]) / s[1];
            if (p > 0 && p < 1) {
              var env = s[2] * (1 - p) * (1 - p);
              sx += env * Math.sin(p * s[3]);
              sy += env * 0.75 * Math.sin(p * s[4] + 0.6 * Math.sin(p * 7));
              sr += env * 0.012 * Math.sin(p * (s[3] - 9));
            }
          }
          shake.style.transform = "translate(" + sx.toFixed(2) + "px," + sy.toFixed(2) + "px) rotate(" + sr.toFixed(3) + "deg)";

          // sparks: pure ballistic function of time
          var T = (t - BURST_AT) / FLIGHT;
          for (var j = 0; j < sparks.length; j++) {
            var sp = sparks[j];
            if (T <= 0 || T >= 1) {
              sp.el.style.opacity = "0";
              continue;
            }
            var ft = T * FLIGHT;
            var x = sp.ox + sp.vx * ft * (1 - 0.35 * T);
            var y = sp.oy + sp.vy * ft * (1 - 0.35 * T) + 0.5 * G * ft * ft;
            var fade = Math.min(1, (1 - T) / FADE_FRAC);
            var stretch = 1.6 - 1.1 * T;
            sp.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + sp.deg.toFixed(1) + "deg) scaleX(" + stretch.toFixed(3) + ")";
            sp.el.style.opacity = fade.toFixed(3);
          }
        }

        var clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, {
          t: 5.5, duration: 5.5, ease: "none",
          onUpdate: function () { render(clock.t); }
        }, 0);
        render(0);

        // ---------- CAMERA macro move ----------
        tl.fromTo(cam, { scale: 1.07 }, { scale: 1.0, duration: 1.0, ease: "power3.out" }, 0);
        tl.to(cam, { scale: 1.035, duration: 0.9, ease: "power2.in" }, 1.0);           // riser tension push
        tl.to(cam, { scale: 0.985, duration: 0.07, ease: "power4.out" }, 1.9);          // impact kick
        tl.to(cam, { scale: 1.0, duration: 0.55, ease: "expo.out" }, 1.97);
        tl.to(cam, { scale: 1.022, duration: 3.03, ease: "sine.inOut" }, 2.52);          // life in the hold

        // ---------- SCENE 1 (0.0–0.3) logo wipe L→R ----------
        tl.fromTo(logo,
          { clipPath: "inset(0% 100% 0% 0%)", x: -18, opacity: 0.4 },
          { clipPath: "inset(0% 0% 0% 0%)", x: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 0);
        tl.fromTo(logoImg,
          { filter: "brightness(2.2) drop-shadow(0px 0px 18px rgba(150,185,255,0.9))" },
          { filter: "brightness(1) drop-shadow(0px 0px 0px rgba(150,185,255,0))", duration: 0.7, ease: "power2.out" }, 0.05);

        // ---------- SCENE 2 (0.3–1.3) card inverse zoom-through + title per-word ----------
        tl.fromTo(card,
          { scale: 2.6, opacity: 0, filter: "blur(26px)", y: 160 },
          { scale: 1, opacity: 1, filter: "blur(0px)", y: 0, duration: 0.62, ease: "expo.out" }, 0.3);
        tl.fromTo(pack, { scale: 1.22 }, { scale: 1.0, duration: 1.3, ease: "power3.out" }, 0.3);
        tl.fromTo(halo, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 0.4);
        tl.fromTo(sheen, { x: 0 }, { x: 1250, duration: 0.7, ease: "power2.inOut" }, 0.62);

        tl.fromTo(words,
          { y: 46, opacity: 0, filter: "blur(12px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: 0.07 }, 0.72);

        // ---------- SCENE 3 (1.3–2.6) strike, SLAM, badge ----------
        // old price arrives just ahead of its strike
        tl.fromTo(oldWrap,
          { y: 30, opacity: 0, filter: "blur(10px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 0.98);
        tl.fromTo(strike, { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power4.out" }, 1.3);
        tl.to(oldText, { color: "rgba(255,255,255,0.42)", duration: 0.25, ease: "power2.out" }, 1.3);
        tl.fromTo(oldWrap, { rotation: 0 }, { rotation: -2, duration: 0.12, ease: "power4.out" }, 1.3);
        tl.to(oldWrap, { rotation: 0, duration: 0.4, ease: "back.out(2)" }, 1.42);
        tl.fromTo(redglow, { opacity: 0 }, { opacity: 0.7, duration: 0.2, ease: "power2.out" }, 1.3);
        tl.to(redglow, { opacity: 0.25, duration: 0.5, ease: "power2.inOut" }, 1.5);

        // riser: glow builds toward the slam
        tl.fromTo(glow, { opacity: 0, scale: 0.7 }, { opacity: 0.75, scale: 1.0, duration: 1.4, ease: "power2.in" }, 0.5);
        tl.fromTo([ringA, ringB, ringC], { scale: 0.92, opacity: 0.4 }, { scale: 0.86, opacity: 1, duration: 1.4, ease: "power2.in" }, 0.5);

        // 1.9 CASH SLAM — accelerate into impact, overshoot settle
        tl.fromTo(price,
          { scale: 2.9, opacity: 0, filter: "blur(30px)" },
          { scale: 0.9, opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.in" }, 1.74);
        tl.to(price, { scale: 1, duration: 0.6, ease: "back.out(3)" }, 1.9);
        // chromatic red ghost snaps into the white
        tl.fromTo(ghost,
          { opacity: 0, x: 0, y: 0, scale: 1 },
          { opacity: 0.9, x: 22, y: 8, scale: 1.04, duration: 0.05, ease: "none" }, 1.9);
        tl.to(ghost, { opacity: 0, x: 0, y: 0, scale: 1, duration: 0.42, ease: "expo.out" }, 1.95);
        // white bloom halo on the numerals
        tl.fromTo(pglow,
          { opacity: 0, scale: 1, filter: "blur(18px)" },
          { opacity: 0.9, scale: 1.08, filter: "blur(22px)", duration: 0.06, ease: "none" }, 1.9);
        tl.to(pglow, { opacity: 0.18, scale: 1.0, filter: "blur(26px)", duration: 0.9, ease: "power3.out" }, 1.96);
        // flash
        tl.fromTo(flash, { opacity: 0 }, { opacity: 0.7, duration: 0.04, ease: "none" }, 1.88);
        tl.to(flash, { opacity: 0, duration: 0.42, ease: "power3.out" }, 1.92);
        // shockwave
        tl.fromTo(shock, { scale: 0.3, opacity: 0.95, borderWidth: 14 },
          { scale: 3.6, opacity: 0, borderWidth: 2, duration: 0.7, ease: "expo.out", immediateRender: false }, 1.9);
        // ground reacts
