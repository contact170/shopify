    (function () {
      var FID = "02-detecte";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(n) { return root.querySelector('[id="' + FID + "-" + n + '"]'); }
      var Q = FID + "-";

      // ---------- Build the Vigilia + keypad (4×4, exact photo layout) ----------
      var ICON = {
        sh1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3l7 3v5c0 4.6-3 8-7 10-4-2-7-5.4-7-10V6z"/><path d="M10 9h4v6h-4"/><path d="M12 12h-3.5"/></svg>',
        sh2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3l7 3v5c0 4.6-3 8-7 10-4-2-7-5.4-7-10V6z"/><circle cx="12" cy="10.5" r="2"/><path d="M8.6 16c.8-1.6 2-2.4 3.4-2.4s2.6.8 3.4 2.4"/></svg>',
        sh3: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3l7 3v5c0 4.6-3 8-7 10-4-2-7-5.4-7-10V6z"/><path d="M9 12h6"/></svg>',
        x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
        ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
        gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.2"/><path d="M12 3.5v2.3M12 18.2v2.3M3.5 12h2.3M18.2 12h2.3M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></svg>'
      };
      var ROWS = [["1", "2", "3", "sh1"], ["4", "5", "6", "sh2"], ["7", "8", "9", "sh3"], ["x", "0", "ok", "gear"]];
      var COLX = [40, 107, 175, 241];   // key left (46px keys)
      var ROWY = [33, 96, 159, 222];    // key top
      var keysHost = $("keys");
      var keys = [];
      var keyById = {};
      ROWS.forEach(function (row, r) {
        row.forEach(function (id, c) {
          var g = ICON[id] || id;
          var k = document.createElement("div");
          k.className = Q + "key";
          k.style.left = COLX[c] + "px";
          k.style.top = ROWY[r] + "px";
          k.innerHTML = '<div class="' + Q + 'kb">' + g + '</div><div class="' + Q + 'kl">' + g + '</div><div class="' + Q + 'kf">' + g + "</div>";
          keysHost.appendChild(k);
          var cx = COLX[c] + 23, cy = ROWY[r] + 23;
          var rec = { el: k, lit: k.children[1], fl: k.children[2], d: Math.hypot(cx - 200, cy - 0) };
          keys.push(rec);
          keyById[id] = rec;
        });
        var dot = document.createElement("div");
        dot.className = Q + "sdot";
        dot.style.top = ROWY[r] + 20 + "px";
        var glow = document.createElement("div");
        glow.className = Q + "sdot-glow";
        glow.style.top = ROWY[r] + 17 + "px";
        $("face").appendChild(glow);
        $("face").appendChild(dot);
      });
      var sdots = root.querySelectorAll('[class~="' + Q + 'sdot-glow"]');
      // cascade order: nearest to the signal's landing point first (deterministic sort)
      var order = keys.slice().sort(function (a, b) { return a.d - b.d; });

      // ---------- Camera: one world wrapper, one writer ----------
      var world = $("world");
      var cam = { s: 1.34, x: -126.3, y: 229.1 };
      var shakes = [
        { amp: 0, p: 0, fx: 7, fy: 5, rot: 0.0 },     // 1.45 arrival tick
        { amp: 0, p: 0, fx: 9, fy: 7, rot: 0.05 }     // 2.2 impact
      ];
      function applyCamera() {
        var sx = 0, sy = 0, sr = 0;
        for (var i = 0; i < shakes.length; i++) {
          var k = shakes[i];
          var a = k.amp;
          if (!a) continue;
          sx += a * Math.sin(k.p * Math.PI * 2 * k.fx);
          sy += a * 0.75 * Math.sin(k.p * Math.PI * 2 * k.fy);
          sr += a * k.rot * Math.sin(k.p * Math.PI * 2 * (k.fx - 2));
        }
        world.style.transform = "translate(" + (cam.x + sx).toFixed(2) + "px," + (cam.y + sy).toFixed(2) + "px) scale(" + cam.s.toFixed(4) + ") rotate(" + sr.toFixed(3) + "deg)";
      }
      applyCamera();

      // ---------- Sensor vibration (seek-safe: zero at both ends) ----------
      var sensor = $("sensor");
      var vib = { p: 0, amp: 0 };
      function applyVib() {
        var a = vib.amp;
        var x = a * Math.sin(vib.p * Math.PI * 2 * 12);
        var r = a * 0.12 * Math.sin(vib.p * Math.PI * 2 * 9);
        sensor.style.transform = "translate(" + x.toFixed(2) + "px,0px) rotate(" + r.toFixed(3) + "deg)";
      }
      applyVib();

      // ---------- Signal path ----------
      var path = $("path");
      var maskPath = $("maskpath");
      var LEN = path.getTotalLength();
      maskPath.setAttribute("stroke-dasharray", (LEN * 1.05).toFixed(2) + " " + (LEN * 1.05).toFixed(2));
      maskPath.setAttribute("stroke-dashoffset", (LEN * 1.05).toFixed(2));
      var comet = $("comet"), cometGlow = $("cometglow"), tail1 = $("tail1"), tail2 = $("tail2");
      var sig = { d: 0 };
      function place(el, f) {
        var pt = path.getPointAtLength(Math.max(0, Math.min(1, f)) * LEN);
        el.setAttribute("cx", pt.x.toFixed(2));
        el.setAttribute("cy", pt.y.toFixed(2));
      }
      function applySig() {
        maskPath.setAttribute("stroke-dashoffset", (LEN * 1.05 * (1 - sig.d)).toFixed(2));
        place(comet, sig.d);
        place(cometGlow, sig.d);
        place(tail1, sig.d - 0.045);
        place(tail2, sig.d - 0.09);
      }
      applySig();

      var tl = gsap.timeline({ paused: true });

      // ===== Scene 1 (0.00–0.55): tight on the WDV301, LED fires at 0.25 =====
      // slow creeping pull already alive under the hero
      tl.fromTo(cam, { s: 1.34, x: -126.3, y: 229.1 }, { s: 1.3, x: -130.5, y: 214.5, duration: 0.55, ease: "power1.out", onUpdate: applyCamera }, 0);
      tl.fromTo(sensor.querySelector("img"), { filter: "brightness(0.82)" }, { filter: "brightness(0.9)", duration: 0.25, ease: "none" }, 0);

      // LED ignition @0.25 (beep) — slot pops red + halo bloom lands as one beat
      tl.fromTo($("led"), { opacity: 0, scaleY: 0.4 }, { opacity: 1, scaleY: 1, duration: 0.12, ease: "expo.out" }, 0.25);
      tl.fromTo($("ledcore"), { opacity: 0 }, { opacity: 0.85, duration: 0.08, ease: "power2.out" }, 0.25);
      tl.fromTo($("halo"), { opacity: 0, scale: 0.55 }, { opacity: 0.45, scale: 1.1, duration: 0.18, ease: "expo.out" }, 0.25);
      tl.fromTo($("halo"), { opacity: 0.45 }, { opacity: 0.32, duration: 0.5, ease: "power2.out", immediateRender: false }, 0.43);

      // sensor buzzes (deterministic decaying sine)
      tl.fromTo(vib, { p: 0 }, { p: 1, duration: 0.5, ease: "none", onUpdate: applyVib }, 0.25);
      tl.fromTo(vib, { amp: 7 }, { amp: 0, duration: 0.5, ease: "power2.out", onUpdate: applyVib }, 0.25);

      // concentric vibration rings
      [$("ring1"), $("ring2"), $("ring3")].forEach(function (rg, i) {
        tl.fromTo(rg, { scale: 0.18, opacity: 0.9, borderWidth: 8 }, { scale: 1.45 + i * 0.25, opacity: 0, borderWidth: 2, duration: 0.85, ease: "expo.out" }, 0.25 + i * 0.11);
      });

      // pill slides in from the right
      tl.fromTo($("vpill"), { x: 260, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.38, ease: "expo.out" }, 0.3);

      // ===== Scene 2 (0.55–1.45): signal departs, camera pulls back to reveal the hub =====
      tl.fromTo($("startring"), { attr: { r: 8 }, opacity: 1 }, { attr: { r: 52 }, opacity: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, 0.55);
      tl.fromTo($("startnode"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.2, ease: "back.out(2)" }, 0.55);
      tl.fromTo($("halo"), { scale: 1.3 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.55);
      tl.fromTo([comet, cometGlow, tail1, tail2], { opacity: 0 }, { opacity: function (i) { return [1, 0.7, 0.6, 0.35][i]; }, duration: 0.06, ease: "none" }, 0.55);
      tl.fromTo(sig, { d: 0 }, { d: 1, duration: 0.9, ease: "power2.in", onUpdate: applySig }, 0.55);
      tl.fromTo($("dash"), { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -78 }, duration: 2.95, ease: "none" }, 0.55);
      tl.fromTo(cam, { s: 1.3, x: -130.5, y: 214.5 }, { s: 1, x: 0, y: 0, duration: 0.9, ease: "power3.inOut", onUpdate: applyCamera, immediateRender: false }, 0.55);

      // hub rises into the reveal
      tl.fromTo($("hub"), { opacity: 0, y: 150, scale: 0.9, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out" }, 0.82);
      tl.fromTo($("face"), { filter: "brightness(0.72)" }, { filter: "brightness(0.8)", duration: 0.5, ease: "none" }, 0.82);

      // ===== Scene 3 (1.45–2.20): signal lands, the hub wakes =====
      tl.fromTo([comet, cometGlow, tail1, tail2], { opacity: function (i) { return [1, 0.7, 0.6, 0.35][i]; } }, { opacity: 0, duration: 0.08, ease: "power1.out", immediateRender: false }, 1.45);
      tl.fromTo($("endring"), { attr: { r: 10 }, opacity: 1 }, { attr: { r: 90 }, opacity: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, 1.45);
      tl.fromTo($("face"), { filter: "brightness(1.25)" }, { filter: "brightness(1)", duration: 0.4, ease: "power3.out", immediateRender: false }, 1.45);
      tl.fromTo($("hub"), { scale: 1.045 }, { scale: 1, duration: 0.4, ease: "power4.out", immediateRender: false }, 1.45);
      tl.fromTo($("hubpulse"), { scale: 1, opacity: 0.85 }, { scale: 1.16, opacity: 0, duration: 0.55, ease: "expo.out" }, 1.45);
      tl.fromTo(shakes[0], { p: 0 }, { p: 1, duration: 0.28, ease: "none", onUpdate: applyCamera }, 1.45);
      tl.fromTo(shakes[0], { amp: 6 }, { amp: 0, duration: 0.28, ease: "power2.out", onUpdate: applyCamera }, 1.45);

      // LED pill green → red
      tl.fromTo($("hledr"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 1.45);
      tl.fromTo($("hledg"), { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none" }, 1.45);
      tl.fromTo(sdots, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", stagger: 0.05 }, 1.47);

      // key backlight cascade (stagger 0.03) from the landing point
      order.forEach(function (k, i) {
        tl.fromTo(k.lit, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, 1.45 + i * 0.03);
      });
      // two keys flash navy on the double keypad beep
      [["sh1", 1.45], ["ok", 1.56]].forEach(function (f) {
        var k = keyById[f[0]];
        tl.fromTo(k.fl, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, f[1]);
        tl.fromTo(k.fl, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, f[1] + 0.12);
        tl.fromTo(k.el, { scale: 0.86 }, { scale: 1, duration: 0.3, ease: "power4.out" }, f[1]);
      });

      // label whoosh @1.6
      tl.fromTo($("hpill"), { x: -220, opacity: 0, filter: "blur(12px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, 1.6);

      // ===== Scene 4 (2.20–3.50): SLAM « Moins d'1 seconde. » then hold =====
      tl.fromTo($("l1"), { opacity: 0, scale: 1.25, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 2.2);
      tl.fromTo($("l2"), { opacity: 0, scale: 1.25, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 2.25);
      tl.fromTo($("accent"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power4.out" }, 2.2);
      tl.fromTo($("flash"), { opacity: 0 }, { opacity: 0.16, duration: 0.03, ease: "none" }, 2.2);
      tl.fromTo($("flash"), { opacity: 0.16 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.23);
      tl.fromTo(shakes[1], { p: 0 }, { p: 1, duration: 0.55, ease: "none", onUpdate: applyCamera }, 2.2);
      tl.fromTo(shakes[1], { amp: 16 }, { amp: 0, duration: 0.55, ease: "power3.out", onUpdate: applyCamera }, 2.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
