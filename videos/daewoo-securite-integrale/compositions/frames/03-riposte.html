  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-riposte"]');
      function $(id) { return root.querySelector('[id="03-riposte-' + id + '"]'); }

      var strobe = $("strobe"), beam = $("beam"), camA = $("camA"), camB = $("camB"), push = $("push");
      var siren = $("siren"), halo = $("halo"), band = $("band"), core = $("core");
      var hr1 = $("hr1"), hr2 = $("hr2"), shock = $("shock");
      var l1wrap = $("l1wrap"), l1 = $("l1"), l2 = $("l2"), pill = $("pill"), sun = $("sun");
      var rings = [], thins = [];
      for (var i = 0; i < 7; i++) { rings.push($("r" + i)); thins.push($("t" + i)); }

      /* cue sheet (local seconds) — sfx impacts land on these */
      var FLASH = [0.30, 0.78, 1.26, 1.74, 2.22, 2.70, 3.18];
      var FLASH_AMP = [1, 1, 1, 1, 1, 0.86, 0.72];
      var RING_AMP = [1, 1, 1, 1, 1, 0.68, 0.44]; /* waves decay after the 2.3 hit */
      var HIT1 = 1.30, HIT2 = 2.30;

      function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
      function expoOut(u) { return u >= 1 ? 1 : 1 - Math.pow(2, -10 * u); }

      /* flash envelope: instant attack, exponential decay */
      function env(t, tau) {
        var s = 0;
        for (var k = 0; k < FLASH.length; k++) {
          var dt = t - FLASH[k];
          if (dt >= 0 && dt < 0.6) s += FLASH_AMP[k] * Math.exp(-dt / tau);
        }
        return s > 1 ? 1 : s;
      }

      /* deterministic decaying sine shake */
      function shake(dt, dur, amp, seed) {
        if (dt < 0 || dt >= dur) return [0, 0, 0];
        var d = Math.pow(1 - dt / dur, 2);
        var w = 2 * Math.PI * 13;
        return [
          amp * d * Math.sin(dt * w + seed),
          amp * 0.72 * d * Math.cos(dt * w * 1.17 + seed * 1.9),
          amp * 0.035 * d * Math.sin(dt * w * 0.83 + seed * 0.7)
        ];
      }

      function render(t) {
        var e = env(t, 0.13);
        var eFast = env(t, 0.05);
        var ramp = clamp01(t / 0.35);

        /* strobe: red bursts on navy */
        strobe.style.opacity = (0.12 * ramp + 0.82 * e).toFixed(4);

        /* rotating beacon: siren sweep under the whole frame */
        gsap.set(beam, { rotation: t * 150, opacity: 0.2 * ramp + 0.45 * e });

        /* siren red block lights up */
        band.style.opacity = (0.08 * ramp + 0.95 * e).toFixed(4);
        halo.style.opacity = (0.22 * ramp + 0.85 * e).toFixed(4);
        gsap.set(halo, { scale: 0.88 + 0.32 * e });
        core.style.opacity = (0.95 * eFast).toFixed(4);
        gsap.set(core, { scale: 0.7 + 0.6 * eFast });

        /* faint concentric rings breathe with the flash */
        hr1.style.opacity = (0.9 * ramp + 0.6 * e).toFixed(4);
        hr2.style.opacity = (0.9 * ramp + 0.5 * e).toFixed(4);
        gsap.set(hr1, { scale: 0.92 + 0.08 * ramp + 0.035 * e });
        gsap.set(hr2, { scale: 0.9 + 0.1 * ramp + 0.03 * e });

        /* sound waves leaving the siren at each flash */
        for (var k = 0; k < FLASH.length; k++) {
          var u = (t - FLASH[k]) / 1.15;
          var a = RING_AMP[k];
          if (u >= 0 && u <= 1) {
            gsap.set(rings[k], { scale: 0.32 + 3.9 * a * expoOut(u), opacity: 0.92 * a * Math.pow(1 - u, 1.6) });
          } else { gsap.set(rings[k], { opacity: 0, scale: 0.32 }); }
          var v = (t - FLASH[k] - 0.07) / 1.0;
          if (v >= 0 && v <= 1) {
            gsap.set(thins[k], { scale: 0.25 + 3.2 * a * expoOut(v), opacity: 0.75 * a * Math.pow(1 - v, 2) });
          } else { gsap.set(thins[k], { opacity: 0, scale: 0.25 }); }
        }

        /* shockwave on the two copy hits (the 2.3 one carries the sub-boom) */
        var s1 = (t - HIT1) / 0.8, s2 = (t - HIT2) / 1.0;
        if (s2 >= 0 && s2 <= 1) {
          gsap.set(shock, { scale: 0.3 + 5.0 * expoOut(s2), opacity: 0.95 * Math.pow(1 - s2, 1.4), borderWidth: 14 });
        } else if (s1 >= 0 && s1 <= 1) {
          gsap.set(shock, { scale: 0.3 + 3.4 * expoOut(s1), opacity: 0.6 * Math.pow(1 - s1, 1.6), borderWidth: 8 });
        } else { gsap.set(shock, { opacity: 0 }); }

        /* camera A: mini-shake on every flash */
        var sx = 0, sy = 0, sr = 0;
        for (var j = 0; j < FLASH.length; j++) {
          var sh = shake(t - FLASH[j], 0.24, 9 * FLASH_AMP[j], j * 1.37 + 0.4);
          sx += sh[0]; sy += sh[1]; sr += sh[2];
        }
        gsap.set(camA, { x: sx, y: sy, rotation: sr });

        /* camera B: heavier hits on the copy slams + scale punch */
        var h1 = shake(t - HIT1, 0.36, 18, 2.1), h2 = shake(t - HIT2, 0.55, 36, 4.3);
        var p1 = t >= HIT1 ? 0.022 * Math.exp(-(t - HIT1) / 0.11) : 0;
        var p2 = t >= HIT2 ? 0.05 * Math.exp(-(t - HIT2) / 0.14) : 0;
        gsap.set(camB, { x: h1[0] + h2[0], y: h1[1] + h2[1], rotation: h1[2] + h2[2], scale: 1 + p1 + p2 });

        /* line 1 gets knocked down by line 2's slam, snaps back */
        var kd = t - HIT2;
        var knock = (kd >= 0 && kd < 0.4) ? 22 * Math.pow(1 - kd / 0.4, 3) * Math.cos(kd * 18) : 0;
        gsap.set(l1wrap, { y: knock });

        /* red glow on the copy, riding the strobe */
        var glow = (14 + 34 * e).toFixed(1);
        var ga = (0.25 + 0.55 * e).toFixed(3);
        l1.style.textShadow = "0 0 " + glow + "px rgba(225,29,72," + ga + ")";
        l2.style.textShadow = "0 0 " + glow + "px rgba(255,45,85," + (0.35 + 0.6 * e).toFixed(3) + ")";
      }

      var tl = gsap.timeline({ paused: true });
      var clock = { t: 0 };

      /* procedural FX clock — pure function of local time, seek-safe */
      tl.fromTo(clock, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

      /* macro camera: slow push under the whole shot */
      tl.fromTo(push, { scale: 1 }, { scale: 1.045, duration: 4, ease: "sine.inOut" }, 0);

      /* Scene 1 — siren zoom-through (scale 1.4 -> 1, blur -> 0) */
      tl.fromTo(siren,
        { scale: 1.4, opacity: 0, filter: "blur(24px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0);
      tl.fromTo(siren, { y: 0 }, { y: -10, duration: 3.45, ease: "sine.inOut" }, 0.55);

      /* Scene 2 — 1.30 hit: "Visible depuis la rue." slams */
      tl.fromTo(l1,
        { opacity: 0, scale: 1.75, y: -24, filter: "blur(20px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, HIT1);

      /* pill pops under the siren */
      tl.fromTo(pill,
        { opacity: 0, scale: 0.45, y: 26 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.2)" }, 1.42);
      tl.fromTo(sun, { rotation: -120, scale: 0.4 }, { rotation: 0, scale: 1, duration: 0.6, ease: "power4.out" }, 1.46);

      /* Scene 3 — 2.30 hit + sub-boom: "Entendue par tout le quartier." slams harder */
      tl.fromTo(l2,
        { opacity: 0, scale: 2.3, y: 30, filter: "blur(28px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, HIT2);

      render(0);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-riposte"] = tl;
    })();
  </script>
