  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "07-sans-abonnement";
      var P = "f07-sans-abonnement-";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#" + P + id); }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---------- build the ticker stack (blurred filler rows, then the landing "0 €") ----------
      var ITEM_H = 370;
      var FILL = ["38", "24", "59", "17", "46", "32", "68", "29", "51", "19", "44", "27", "36", "58", "22"];
      var stack = $("stack");
      for (var k = 0; k < FILL.length; k++) {
        var d = document.createElement("div");
        d.className = "f07-sans-abonnement-item f07-sans-abonnement-fill";
        d.textContent = FILL[k] + " €";
        stack.appendChild(d);
      }
      var zeroEl = document.createElement("div");
      zeroEl.className = "f07-sans-abonnement-item";
      zeroEl.textContent = "0 €";
      stack.appendChild(zeroEl);

      var STEPS = FILL.length; // 15 transitions → lands on index 15 ("0 €")
      var springs = [];
      for (var s = 0; s < STEPS; s++) springs.push({ p: 0 });
      function applyTicker() {
        var sum = 0;
        for (var j = 0; j < springs.length; j++) sum += springs[j].p;
        stack.style.transform = "translate3d(0," + (-sum * ITEM_H).toFixed(2) + "px,0)";
      }
      applyTicker();

      // Accelerating slot-machine steps: sparse at first, denser toward 0.85s.
      var SPIN_END = 0.85;
      var starts = [];
      for (var i = 0; i < STEPS - 1; i++) starts.push(SPIN_END * Math.pow(i / (STEPS - 1), 0.6));
      for (var i2 = 0; i2 < STEPS - 1; i2++) {
        var next = i2 + 1 < STEPS - 1 ? starts[i2 + 1] : SPIN_END;
        var dur = Math.max(0.09, (next - starts[i2]) * 1.6);
        tl.to(springs[i2], { p: 1, duration: dur, ease: "back.out(1.3)", onUpdate: applyTicker }, starts[i2]);
      }
      // Climax step: spin-and-land, crosses the window at ~0.93 and recoils on the 0.95 slam.
      tl.to(springs[STEPS - 1], { p: 1, duration: 0.34, ease: "back.out(2.6)", onUpdate: applyTicker }, SPIN_END);

      // Motion blur rides the velocity: heavy vertical smear while spinning (no readable amount), snaps sharp on the slam.
      var fe = $("mblur-fe");
      tl.fromTo(fe, { attr: { stdDeviation: "8 60" } }, { attr: { stdDeviation: "12 100" }, duration: 0.9, ease: "power2.in" }, 0);
      tl.to(fe, { attr: { stdDeviation: "0 0" }, duration: 0.12, ease: "power2.out" }, 0.95);

      // ---------- deterministic decaying camera shake ----------
      var shakeEl = $("shake");
      function shake(t0, amp, n, total, seed) {
        var step = total / n;
        for (var q = 0; q < n; q++) {
          var decay = Math.pow(1 - q / n, 2);
          tl.to(shakeEl, {
            x: amp * decay * Math.sin(q * 2.37 + seed),
            y: amp * 0.8 * decay * Math.cos(q * 3.11 + seed * 1.7),
            rotation: amp * 0.025 * decay * Math.sin(q * 1.73 + seed),
            duration: step, ease: "sine.inOut"
          }, t0 + q * step);
        }
        tl.to(shakeEl, { x: 0, y: 0, rotation: 0, duration: step, ease: "sine.out" }, t0 + n * step);
      }

      // ---------- camera: slow continuous push underneath ----------
      tl.fromTo($("cam"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.03, duration: 4, ease: "sine.inOut" }, 0);

      // ---------- Scene 1 (0.0–0.95): label + spinning ticker ----------
      tl.fromTo($("label"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0);
      tl.fromTo($("ticker"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, 0);
      tl.fromTo($("zoom"), { scale: 0.9, transformOrigin: "40% 50%" }, { scale: 1.12, duration: 0.95, ease: "power2.in" }, 0);

      // ---------- Scene 2 (0.95–1.45): "0 €" SLAM + shake + strike ----------
      tl.to($("zoom"), { scale: 1, duration: 0.5, ease: "expo.out" }, 0.95);
      shake(0.95, 22, 12, 0.46, 0.7);
      tl.fromTo($("ring"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 0.7, duration: 0.05, ease: "none" }, 0.95);
      tl.to($("ring"), { scale: 9, duration: 0.75, ease: "expo.out" }, 1.0);
      tl.fromTo($("glow"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 0.95);
      tl.to($("label"), { opacity: 0.55, duration: 0.3, ease: "power1.out" }, 0.95);

      tl.fromTo($("strike"), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.32, ease: "expo.out" }, 1.0);
      tl.fromTo($("strike-bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.inOut" }, 1.1);

      // ---------- Scene 3 (1.45–2.2): "À vie." SLAM beside the 0 € ----------
      tl.fromTo($("avie"),
        { opacity: 0, scale: 2.5, filter: "blur(26px)", transformOrigin: "30% 60%" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, 1.41);
      shake(1.45, 12, 9, 0.34, 2.1);
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 1.6);

      // ---------- Scene 4 (2.2–4.0): three guarantees, one per beat ----------
      var BEATS = [2.2, 2.7, 3.2];
      for (var b = 0; b < 3; b++) {
        var T = BEATS[b];
        var n = b + 1;
        tl.fromTo($("badge" + n),
          { scale: 0, rotation: -35, transformOrigin: "50% 50%" },
          { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.4)" }, T - 0.05);
        tl.fromTo(root.querySelector("#" + P + "badge" + n + " path"),
          { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, T);
        tl.fromTo($("txt" + n),
          { opacity: 0, x: -110, filter: "blur(16px)" },
          { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, T - 0.04);
        shake(T, 5, 5, 0.18, 3.3 + b);
      }

      window.__timelines[FID] = tl;
    })();
  </script>
