    { y: 1180, rotationX: 34, rotationZ: -6, scale: 0.88 },

  tl.fromTo(lock, { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, 0.28);

  tl.fromTo(notif, { y: -300, opacity: 0, scale: 0.92 }, { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "expo.out" }, 0.62);

  tl.fromTo(lock, { y: 0 }, { y: 30, duration: 0.5, ease: "expo.out", immediateRender: false }, 0.66);
  tl.fromTo(glowRed, { opacity: 0, scale: 0.8 }, { opacity: 0.95, scale: 1.05, duration: 0.25, ease: "power3.out" }, 0.7);
