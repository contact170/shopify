  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "01-hook-0312";
      var DUR = 4;
      var R = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (s) { return R.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(R.querySelectorAll(s)); };

      // ---- cue grid (local seconds; SFX land on these exact times) ----
      var T_CLOCK = 0.45;   // impact on "03:12"
      var T_TICK = 0.24;    // clock tick cadence 0.45 -> 1.6
      var T_TICK_END = 1.6;
      var T_WIN = 1.6;      // window rises
      var T_VIB = 1.95;     // glass rattle
      var VIB_DUR = 0.8;
      var T_SUB = 2.15;
      var T_TITLE = 2.9;    // impact + glitch
      var GLITCH_DUR = 0.2;
      var HEART = 0.75;     // heartbeat period

      var camera = q(".f01-camera");
      var colon = q(".f01-colon");
      var shake = q(".f01-win-shake");
      var panes = qa(".f01-pane");
      var pulse = q(".f01-pulse");

      var camEase = gsap.parseEase("power1.inOut");
      var TAU = Math.PI * 2;

      // decaying impact shakes (deterministic, sine-derived)
      var IMPACTS = [
        { at: T_CLOCK, amp: 12, dur: 0.38, f: 19, rot: 0.25 },
        { at: T_VIB, amp: 4, dur: VIB_DUR, f: 23, rot: 0.08 },
        { at: T_TITLE, amp: 26, dur: 0.6, f: 17, rot: 0.55 }
      ];

      function hash(n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      }

      // ONE writer for all clock-derived state
      function render(t) {
        // camera: slow 1.08 -> 1.0 pull + organic drift + decaying shakes
        var s = 1.08 - 0.08 * camEase(Math.min(1, Math.max(0, t / DUR)));
        var dx = Math.sin(t * 0.9) * 4;
        var dy = Math.sin(t * 0.9 * 1.3) * 2;
        var rot = 0;
        for (var i = 0; i < IMPACTS.length; i++) {
          var k = IMPACTS[i];
          var u = t - k.at;
          if (u >= 0 && u < k.dur) {
            var env = Math.pow(1 - u / k.dur, 2);
            dx += k.amp * env * Math.sin(TAU * k.f * u + 0.7 + i);
            dy += k.amp * 0.7 * env * Math.sin(TAU * k.f * 1.31 * u + 1.9 + i);
            rot += k.rot * env * Math.sin(TAU * k.f * 0.77 * u + 0.3);
          }
        }
        camera.style.transform =
          "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px) rotate(" + rot.toFixed(3) + "deg) scale(" + s.toFixed(4) + ")";

        // colon: discrete on/off steps on the tick tempo, then slower after the ticks stop
        var on = 1;
        if (t >= T_CLOCK) {
          var stepLen = t < T_TICK_END ? T_TICK : 0.5;
          var base = t < T_TICK_END ? T_CLOCK : T_TICK_END;
          on = Math.floor((t - base) / stepLen) % 2 === 0 ? 1 : 0.18;
        }
        colon.style.opacity = on;
        colon.style.color = t >= T_TITLE ? "#e11d48" : "#ffffff";

        // window glass rattle: per-frame alternating, decaying ±8px, then a residual tense tremor
        var wx = 0, wy = 0, wr = 0, px = 0;
        var v = t - T_VIB;
        if (v >= 0) {
          var stp = Math.floor(v * 30);
          var sign = stp % 2 === 0 ? 1 : -1;
          var envV = v < VIB_DUR ? Math.pow(1 - v / VIB_DUR, 1.6) : 0;
          var amp = 8 * envV + 1.2;
          wx = sign * amp * (0.65 + 0.35 * hash(stp));
          wy = -sign * amp * 0.3 * hash(stp + 17);
          wr = sign * (0.35 * envV + 0.05) * hash(stp + 5);
          px = -sign * (3 * envV + 0.4);
        }
        gsap.set(shake, { x: wx, y: wy, rotation: wr });
        gsap.set(panes[0], { x: px });
        gsap.set(panes[1], { x: -px * 0.8 });

        // heartbeat darkening (lub-dub every 0.75s)
        var ph = t % HEART;
        var beat = Math.exp(-ph * 10) + (ph >= 0.18 ? 0.6 * Math.exp(-(ph - 0.18) * 12) : 0);
        pulse.style.opacity = (0.22 * Math.min(1, beat)).toFixed(3);
      }

      var tl = gsap.timeline({ paused: true });
      var clk = { t: 0 };
      render(0);

      // master clock: drives camera, colon, rattle, heartbeat (spans the whole frame)
      tl.to(clk, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(clk.t); } }, 0);

      // ---- Scene 2 (0.45) : "03:12" slam + 1-frame white flash ----
      tl.fromTo(".f01-clock", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, T_CLOCK);
      tl.fromTo(
        ".f01-clock",
        { scale: 1.75, filter: "blur(28px)" },
        { scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out" },
        T_CLOCK
      );
      tl.fromTo(
        ".f01-clock-echo",
        { opacity: 0.75, scale: 1 },
        { opacity: 0, scale: 1.38, duration: 0.7, ease: "power2.out" },
        T_CLOCK + 0.03
      );
      tl.set(".f01-flash", { opacity: 0.9 }, T_CLOCK);
      tl.set(".f01-flash", { opacity: 0 }, T_CLOCK + 1 / 30);

      // eyebrow per-letter reveal over 0.8s
      tl.fromTo(
        ".f01-eyebrow span",
        { opacity: 0, y: 16, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", stagger: 0.045 },
        T_CLOCK + 0.1
      );

      // ---- Scene 3 (1.6) : window rises, rattles at 1.95 ----
      tl.fromTo(
        ".f01-win-rise",
        { y: 620, opacity: 0, rotation: 5, filter: "blur(14px)" },
        { y: 0, opacity: 1, rotation: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
        T_WIN
      );
      tl.fromTo(
        ".f01-sheen",
        { xPercent: -120, opacity: 0.9 },
        { xPercent: 170, opacity: 0.9, duration: 0.85, ease: "power2.inOut", stagger: 0.06 },
        T_WIN + 0.15
      );

      // "(( ))" waves pulse 3 times from 1.95 (last pulse settles and holds)
      [0, 1, 2].forEach(function (n) {
        var at = T_VIB + n * 0.25;
        var last = n === 2;
        [".f01-l", ".f01-r"].forEach(function (side) {
          var dir = side === ".f01-l" ? -1 : 1;
          var sel = ".f01-wave" + side + ".f01-w" + n;
          tl.fromTo(sel, { opacity: 0, scale: 0.6, x: 18 * -dir }, { opacity: 1, scale: 1.05, x: 0, duration: 0.09, ease: "power4.out" }, at);
          if (last) {
            tl.to(sel, { opacity: 0.6, scale: 1, x: 4 * dir, duration: 0.4, ease: "power2.out" }, at + 0.09);
          } else {
            tl.to(sel, { opacity: 0, scale: 1.2, x: 46 * dir, duration: 0.32, ease: "power2.out" }, at + 0.09);
          }
        });
      });

      // "Tout le monde dort." discreet rise
      tl.fromTo(".f01-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, T_SUB);

      // ---- Scene 4 (2.9) : "Une fenêtre vibre." slam + chromatic glitch ----
      tl.fromTo(
        ".f01-gstack",
        { opacity: 0, scaleX: 1.6, scaleY: 0.85, y: 24, filter: "blur(10px)" },
        { opacity: 1, scaleX: 1, scaleY: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power4.out" },
        T_TITLE
      );
      var copies = qa(".f01-gcopy");
      var amp = { a: 0 };
      var JITTER_STEP = 1 / 30;
      var MAX_SPLIT = 12;
      tl.set(amp, { a: 1 }, T_TITLE);
      tl.set(copies, { opacity: 0.85 }, T_TITLE);
      tl.to(
        amp,
        {
          a: 0,
          duration: GLITCH_DUR,
          ease: "power3.in",
          onUpdate: function () {
            var step = Math.floor(tl.time() / JITTER_STEP);
            copies.forEach(function (el, layer) {
              var jx = (hash(step * 13 + layer * 7) * 2 - 1) * MAX_SPLIT * amp.a + (layer === 0 ? -1 : 1) * 4 * amp.a;
              var jy = (hash(step * 29 + layer * 11) * 2 - 1) * MAX_SPLIT * 0.35 * amp.a;
              gsap.set(el, { x: jx, y: jy });
            });
          }
        },
        T_TITLE
      );
      tl.set(copies, { x: 0, y: 0, opacity: 0 }, T_TITLE + GLITCH_DUR);

      // impact red flash + rising alarm light in the bottom of frame
      tl.fromTo(".f01-redflash", { opacity: 0.35 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, T_TITLE);
      tl.fromTo(".f01-alarm", { opacity: 0 }, { opacity: 0.55, duration: DUR - T_TITLE, ease: "power2.in" }, T_TITLE);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
