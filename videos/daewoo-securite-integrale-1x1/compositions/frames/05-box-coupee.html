    <script>
      (function () {
        var FID = "f05";
        var root = document.querySelector('[data-composition-id="05-box-coupee"]');
        var byId = function (s) { return root.querySelector('[id="' + FID + "-" + s + '"]'); };
        var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll('[class~="' + FID + "-" + s + '"]')); };

        var push = byId("push"), shake = byId("shake");
        var titleWrap = byId("title");
        var tBase = all("tbase")[0], tGhosts = all("tghost"), tSlices = all("tslice");
        var wGhosts = all("wghost");
        var wCopies = all("wcopy");
        var dim = byId("dim"), scan = byId("scan"), flash = byId("flash"), bands = all("band");
        var rings = all("ring"), pring = byId("pring");
        var smsVibe = byId("smsvibe"), callVibe = byId("callvibe");

        // arcs per copy: [outer, middle, inner]; dots per copy
        var arcsByCopy = wCopies.map(function (svg) { return Array.prototype.slice.call(svg.querySelectorAll("path")); });
        var dots = wCopies.map(function (svg) { return svg.querySelector("circle"); });

        // static slice bands (clip-path is constant — seek-safe)
        var nS = tSlices.length;
        tSlices.forEach(function (el, i) {
          var a = (i * 100) / nS, b = 100 - ((i + 1) * 100) / nS;
          gsap.set(el, { clipPath: "inset(" + a.toFixed(2) + "% -40px " + b.toFixed(2) + "% -40px)" });
        });

        // --- deterministic helpers ---
        var hash = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
        var JIT = 1 / 30;
        var win = function (t, t0, d) { var k = (t - t0) / d; return k >= 0 && k <= 1 ? k : -1; };

        // camera shakes: [t0, dur, amp px, rad/s, phase, scalePunch]
        var SHAKES = [
          [0.0, 0.32, 4, 70, 0.3, 0],
          [0.5, 0.45, 15, 55, 1.1, 0.012],
          [1.2, 0.28, 6, 48, 0.5, 0.01],
          [2.5, 0.5, 26, 46, 2.0, 0.03]
        ];
        var ARC_OFF = [0.16, 0.3, 0.44];

        function drive(t) {
          var step = Math.floor(t / JIT + 1e-6);

          // 1. camera shake (decaying, sine-derived)
          var sx = 0, sy = 0, sr = 0, ss = 0;
          SHAKES.forEach(function (s) {
            var k = win(t, s[0], s[1]); if (k < 0) return;
            var e = (1 - k) * (1 - k), u = t - s[0];
            sx += s[2] * e * Math.sin(u * s[3] + s[4]);
            sy += s[2] * 0.7 * e * Math.sin(u * s[3] * 1.37 + s[4] * 2);
            sr += s[2] * 0.035 * e * Math.sin(u * s[3] * 0.83 + s[4]);
            ss += s[5] * e;
          });
          gsap.set(shake, { x: sx, y: sy, rotation: sr, scale: 1 + ss });

          // 2. Wi-Fi arcs die one by one (outer → inner), dot drops at power-down
          var arcOp = ARC_OFF.map(function (off, i) {
            if (t >= off + 0.07) return 0.3;
            if (t >= off) return hash(step * 5 + i) > 0.5 ? 0.75 : 0.3;
            var p = t > off - 0.12 ? 0.45 : 0.12;
            return hash(step * 3 + i * 17) < p ? 0.35 : 1;
          });
          var dotOp = t < 0.5 ? (hash(step * 11) < 0.1 ? 0.5 : 1) : t < 0.56 ? (hash(step * 13) > 0.5 ? 0.8 : 0.3) : 0.32;
          arcsByCopy.forEach(function (arcs, c) {
            arcs.forEach(function (p, i) { p.style.opacity = arcOp[i]; });
            dots[c].style.opacity = dotOp;
          });

          // 3. Wi-Fi RGB-split jitter (crackle 0–0.5, cut 0.55–0.9)
          var wa = 0, k1 = win(t, 0.0, 0.5), k2 = win(t, 0.55, 0.35);
          if (k1 >= 0) wa = (0.45 + 0.55 * hash(step * 19)) * (1 - k1);
          if (k2 >= 0) wa = Math.pow(1 - k2, 1.3);
          wGhosts.forEach(function (el, L) {
            gsap.set(el, {
              x: wa * (hash(step * 13 + L * 7) * 2 - 1) * 18,
              y: wa * (hash(step * 29 + L * 11) * 2 - 1) * 6,
              opacity: wa > 0.01 ? 0.85 : 0
            });
          });

          // 4. title ghosts (slam 0.12–0.42, cut 0.55–0.9) + slice tear (0.55–0.92)
          var ta = 0, k3 = win(t, 0.12, 0.3);
          if (k3 >= 0) ta = Math.pow(1 - k3, 1.2);
          if (k2 >= 0) ta = Math.max(ta, Math.pow(1 - k2, 1.3));
          tGhosts.forEach(function (el, L) {
            gsap.set(el, {
              x: ta * (hash(step * 17 + L * 5) * 2 - 1) * 16,
              y: ta * (hash(step * 31 + L * 3) * 2 - 1) * 5,
              opacity: ta > 0.01 ? 0.8 : 0
            });
          });
          var ks = win(t, 0.55, 0.37), sa = ks >= 0 ? Math.pow(1 - ks, 1.3) : 0;
          var tearing = sa > 0.04;
          tBase.style.opacity = tearing ? 0 : 1;
          tSlices.forEach(function (el, i) {
            gsap.set(el, {
              x: tearing ? sa * (hash(step * 13 + i * 7) * 2 - 1) * 80 : 0,
              scaleX: tearing ? 1 + sa * hash(step * 7 + i * 3) * 0.22 : 1,
              opacity: tearing ? 1 : 0
            });
          });

          // 5. power-down dim (flicker 0.5–0.8, hold, relight at the 4G switch 1.2)
          var d = 0;
          if (t >= 0.5 && t < 0.8) d = 0.62 * (hash(step * 23) < 0.3 ? 0.35 : 1);
          else if (t >= 0.8 && t < 1.2) d = 0.62;
          else if (t >= 1.2 && t < 1.6) { var kr = (t - 1.2) / 0.4; d = 0.62 - 0.47 * (1 - Math.pow(1 - kr, 3)); }
          else if (t >= 1.6) d = 0.15;
          dim.style.opacity = d;

          // 6. scanlines + noise bands
          var sc = 0, ba = 0;
          if (t < 0.3) { sc = 0.12 * hash(step * 37); ba = 0.5 * (1 - t / 0.3); }
          else if (t >= 0.55 && t < 0.95) { sc = 0.55 * (0.75 + 0.25 * hash(step * 31)); ba = 1; }
          else if (t >= 0.95 && t < 1.25) { sc = 0.55 * (1 - (t - 0.95) / 0.3); ba = 0.4 * (1 - (t - 0.95) / 0.3); }
          scan.style.opacity = sc;
          bands.forEach(function (el, i) {
            var on = ba > 0 && hash(step * 41 + i * 9) > 0.35;
            gsap.set(el, { y: Math.floor(hash(step * 43 + i * 5) * 1040), opacity: on ? 0.9 * ba : 0 });
          });

          // 7. flashes (power-down hit 0.5, slam hit 2.5)
          var f = 0, kf1 = win(t, 0.5, 0.1), kf2 = win(t, 2.5, 0.14);
          if (kf1 >= 0) f = 0.32 * (1 - kf1);
          if (kf2 >= 0) f = 0.16 * (1 - kf2);
          flash.style.opacity = f;

          // 8. green 4G wave rings (1.2, 1.34)
          [1.2, 1.34].forEach(function (t0, i) {
            var k = win(t, t0, 0.95);
            if (k < 0) { gsap.set(rings[i], { scale: 0.35, opacity: 0 }); return; }
            gsap.set(rings[i], { scale: 0.35 + 3.9 * (1 - (1 - k) * (1 - k)), opacity: 0.95 * (1 - k) });
          });

          // 9. vibration buzz — SMS (1.7) and call (2.15)
          var vib = function (el, t0, dur, ax, ar) {
            var k = win(t, t0, dur);
            if (k < 0) { gsap.set(el, { x: 0, rotation: 0 }); return; }
            var e = 1 - k, buzz = Math.sin(k * Math.PI * 3) > 0 ? 1 : 0.2, u = t - t0;
            gsap.set(el, { x: ax * e * buzz * Math.sin(u * 150), rotation: ar * e * buzz * Math.sin(u * 120 + 0.7) });
          };
          vib(smsVibe, 1.72, 0.42, 8, 1.2);
          vib(callVibe, 2.17, 0.5, 6, 3.2);

          // 10. phone ring pulse (2.2)
          var kp = win(t, 2.2, 0.55);
          gsap.set(pring, kp < 0 ? { scale: 1, opacity: 0 } : { scale: 1 + 0.9 * (1 - (1 - kp) * (1 - kp)), opacity: 0.8 * (1 - kp) });
        }

        var tl = gsap.timeline({ paused: true });

        // macro camera: slow push under the whole shot
        tl.fromTo(push, { scale: 1 }, { scale: 1.03, duration: 3.5, ease: "none" }, 0);

        // deterministic driver (shakes, glitch, flicker, vibration) — pure function of time
        var proxy = { p: 0 };
        tl.to(proxy, { p: 1, duration: 3.5, ease: "none", onUpdate: function () { drive(tl.time()); } }, 0);

        // Square reflow: the Wi-Fi/title row opens centred and big (fills the square in act 1),
        // then lifts to the top at the 4G switch (1.2) to make room for the 4G story.
        tl.fromTo(byId("row"), { y: 300, scale: 1.08 }, { y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 1.08);

        // Scene 1 — "Box coupée ?" slams under the crackling icon
